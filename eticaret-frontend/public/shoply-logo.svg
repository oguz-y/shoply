           Q 84 32 128 32
           Q 172 32 172 72
           L 172 96"
        fill="none"
        stroke="url(#handleGradient)"
        stroke-width="14"
        stroke-linecap="round"/>

  <!-- S monogram cut from bag -->
  <path d="M 145 128
           Q 145 116 132 116
           Q 119 116 119 127
           Q 119 137 132 140
           Q 149 144 149 158
           Q 149 172 133 172
           Q 117 172 116 158"
        fill="none"
